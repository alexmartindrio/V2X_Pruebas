name: Deploy to AWS ECR, S3 & EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 1. Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: v2x_prueba
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: 2. Subir archivo .txt (versión) al Bucket S3
        run: |
          echo "${{ github.sha }}" > version.txt
          aws s3 cp version.txt s3://v2xprueba1/version.txt

      - name: 3. Actualizar EC2 mediante AWS Systems Manager y esperar resultado
        run: |
          # Enviar el comando y capturar el ID de la ejecución
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0aca8c0fe600148fa" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/v2x_prueba:latest",
              "docker stop mi-contenedor || true",
              "docker rm mi-contenedor || true",
              "docker run -d --name mi-contenedor -p 80:5000 ${{ steps.login-ecr.outputs.registry }}/v2x_prueba:latest"
            ]' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM enviado (ID: $COMMAND_ID). Esperando a que el EC2 lo ejecute..."

          # Esperar a que el comando termine de ejecutarse en el EC2
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0aca8c0fe600148fa" \
            --region us-east-1

          echo "--- LOGS DE SALIDA EN EL EC2 ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0aca8c0fe600148fa" \
            --region us-east-1 \
            --query "StandardOutputContent" \
            --output text

          echo "--- ERRORES (SI LOS HUBO) ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0aca8c0fe600148fa" \
            --region us-east-1 \
            --query "StandardErrorContent" \
            --output text
