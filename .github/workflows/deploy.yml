name: Deploy to AWS ECR, S3 & EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 1. Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: v2x_prueba
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: 2. Subir archivo .txt (versión) al Bucket S3
        run: |
          echo "${{ github.sha }}" > version.txt
          aws s3 cp version.txt s3://v2xprueba1/version.txt

      - name: 3. Actualizar EC2
        run: |
          aws ssm send-command \
            --instance-ids "i-0aca8c0fe600148fa" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/v2x_prueba:latest",
              "docker stop mi-contenedor || true",
              "docker rm mi-contenedor || true",
              "docker ps -q --filter publish=5000 | xargs -r docker stop || true",
              "docker ps -a -q --filter publish=5000 | xargs -r docker rm || true",
              "docker run -d --name mi-contenedor -p 5000:5000 ${{ steps.login-ecr.outputs.registry }}/v2x_prueba:latest"
            ]' \
            --region us-east-1
